; Configuração do PlatformIO — https://docs.platformio.org/page/projectconf.html
; Versões fixadas para que todos compilem com a mesma toolchain.

[platformio]
default_envs = esp32dev

[env]
platform = espressif32 @ 7.1.3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags =
    -Wall
    -Wextra
; Bibliotecas: adicione aqui sempre com versão fixa, ex.:
;   bblanchon/ArduinoJson @ 7.2.0
lib_deps =

[env:esp32dev]
board = esp32dev
upload_speed = 921600
